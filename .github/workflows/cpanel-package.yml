name: cpanel-package

# Builds a ready-to-upload zip for cPanel hosting (docs/CPANEL.md): PHP packages and the built
# front end are included, so the server needs no Composer or Node. Download it from the run's
# "Artifacts" section, or from the release when a v* tag is pushed.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build woodstone-cpanel.zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach the zip to a v* release and publish it on the cpanel-package branch

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build front end (needs dev packages for Wayfinder route generation)
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm install
          npm run build

      - name: Production PHP packages only
        run: |
          rm .env
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader --no-scripts
          composer dump-autoload --optimize --no-dev --no-scripts
          rm -f bootstrap/cache/*.php

      - name: Zip
        run: |
          mkdir -p dist
          zip -qr dist/woodstone-cpanel.zip . \
            -x '.git/*' 'node_modules/*' 'tests/*' 'dist/*' '.github/*' 'storage/logs/*.log' \
               'database/database.sqlite' 'storage/framework/cache/data/*' 'storage/framework/sessions/[!.]*' \
               'storage/framework/views/*.php' '.env' 'public/hot' '.phpunit.cache/*'
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woodstone-cpanel
          path: dist/woodstone-cpanel.zip
          retention-days: 30

      - name: Attach to release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/woodstone-cpanel.zip --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "cPanel package. See docs/CPANEL.md." || gh release upload "${GITHUB_REF_NAME}" dist/woodstone-cpanel.zip --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Publish on the cpanel-package branch (direct download, newest main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pkg && cp dist/woodstone-cpanel.zip pkg/
          cd pkg
          printf '# WoodStone RMS: cPanel package\n\nBuilt from %s on %s.\nDownload woodstone-cpanel.zip and follow docs/CPANEL.md on main.\n' "${GITHUB_SHA::7}" "$(date -u +%F)" > README.md
          git init -q -b cpanel-package
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "cPanel package from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cpanel-package
